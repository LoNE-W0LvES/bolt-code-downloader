<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 250px; padding: 15px; font-family: sans-serif; }
    input { width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box; }
    button { width: 100%; padding: 8px; cursor: pointer; background: #3b82f6; color: white; border: none; border-radius: 4px; }
    #status { margin-top: 10px; font-size: 11px; color: #666; }
  </style>
</head>
<body>
  <p style="font-size: 12px; font-weight: bold;">Base Subfolder (inside Downloads):</p>
  <input type="text" id="subfolder" placeholder="e.g. MyProject">
  <button id="save">Save Settings</button>
  <div id="status">Files will save to: Downloads/</div>
  <script src="popup.js"></script>
</body>
</html>
